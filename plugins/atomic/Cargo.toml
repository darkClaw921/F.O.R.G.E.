[package]
name = "forge-atomic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Атомарная запись приватного файла (tmp → fsync → rename → 0600) — единая точка для всех плагинов F.O.R.G.E."

# САМЫЙ ЛИСТОВОЙ крейт рабочего пространства: НИ ОДНОЙ зависимости на другой
# член workspace и ни одной на runtime. Ни tokio, ни serde, ни axum — только
# `std` и `anyhow` для типа ошибки.
#
# Крейт родился из `forge-chat-analysis::atomic`, но остаться там не мог:
# `forge-chat-analysis` тянет tokio (features = full), tokio-util, uuid и
# `forge-claude-runner`. Плагину, которому нужен только `tmp+rename+chmod`
# (например, forge-meet пишет manifest.json, transcript.json/md, summary.md и
# chrome.pid), пришлось бы либо тащить весь раннер Claude ради четырёх функций,
# либо завести ЧЕТВЁРТУЮ копию последовательности — ровно ту болезнь, ради
# лечения которой atomic и выносили из плагинов.
#
# Правило на будущее: в этот крейт не добавляется НИЧЕГО, кроме зависимостей,
# которые уже есть в дереве каждого потребителя. Иначе он перестанет быть
# бесплатным для подключения, и следующий плагин снова напишет свою копию.
[dependencies]
# Единственная зависимость: тип ошибки. anyhow уже есть в дереве у всех
# потребителей (workspace-версия), нового узла не появляется.
anyhow = { workspace = true }

[dev-dependencies]
# Временные каталоги для тестов инварианта «частичного состояния на диске не
# бывает»: реальные права, реальный rename, реальный мусор от упавшего
# процесса.
tempfile = "3"
